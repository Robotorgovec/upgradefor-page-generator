name: Baseline Guard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  baseline-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify accepted baseline commit is an ancestor
        run: git merge-base --is-ancestor 4a2e07b HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run baseline smoke against accepted production
        env:
          BASE_URL: https://upgradefor.com
        run: npm run baseline:smoke

      - name: Build
        run: npm run build

      - name: Validate protected layout behavior
        run: npm run test:layout
