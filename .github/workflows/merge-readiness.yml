name: PR Merge Readiness

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - review_requested
      - review_request_removed
      - edited
      - converted_to_draft
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  readiness:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Build merge readiness report
        uses: actions/github-script@v7
        env:
          DEFAULT_REVIEWERS: ${{ vars.DEFAULT_REVIEWERS }}
          DEFAULT_REVIEW_TEAMS: ${{ vars.DEFAULT_REVIEW_TEAMS }}
          AUTO_UPDATE_BRANCH: ${{ vars.AUTO_UPDATE_BRANCH }}
        with:
          script: |
            const marker = '<!-- merge-readiness-report -->';
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const reviewsResp = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100
            });

            const latestReviewByUser = new Map();
            for (const review of reviewsResp.data) {
              latestReviewByUser.set(review.user.login, review.state);
            }

            const approvedCount = [...latestReviewByUser.values()]
              .filter((state) => state === 'APPROVED').length;

            let requiredApprovals = 1;
            let requireConversationResolution = false;
            let requiredChecks = [];

            try {
              const protection = await github.rest.repos.getBranchProtection({
                owner,
                repo,
                branch: pr.base.ref
              });
              requiredApprovals = protection.data.required_pull_request_reviews?.required_approving_review_count ?? 1;
              requireConversationResolution = Boolean(
                protection.data.required_conversation_resolution?.enabled
              );
              requiredChecks = protection.data.required_status_checks?.checks?.map((c) => c.context) || [];
            } catch (error) {
              core.warning(`Could not read branch protection: ${error.message}`);
            }

            const checksResp = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: pr.head.sha,
              per_page: 100
            });

            const checks = checksResp.data.check_runs.map((run) => ({
              name: run.name,
              status: run.status,
              conclusion: run.conclusion || 'pending'
            }));

            let unresolvedConversations = 'unknown';
            try {
              const conversationQuery = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100) {
                        nodes { isResolved }
                      }
                    }
                  }
                }`,
                { owner, repo, number: pr.number }
              );

              const threads = conversationQuery.repository.pullRequest.reviewThreads.nodes || [];
              unresolvedConversations = threads.filter((thread) => !thread.isResolved).length;
            } catch (error) {
              core.warning(`Could not read review threads: ${error.message}`);
            }

            const requestedReviewers = [
              ...(pr.requested_reviewers || []).map((user) => `@${user.login}`),
              ...(pr.requested_teams || []).map((team) => `@${owner}/${team.slug}`)
            ];

            const isUpToDate = pr.mergeable_state !== 'behind';
            if (!isUpToDate && process.env.AUTO_UPDATE_BRANCH === 'true') {
              try {
                await github.rest.pulls.updateBranch({
                  owner,
                  repo,
                  pull_number: pr.number,
                  expected_head_sha: pr.head.sha
                });
              } catch (error) {
                core.warning(`Could not update branch automatically: ${error.message}`);
              }
            }

            if (approvedCount < requiredApprovals) {
              const usersToRequest = (process.env.DEFAULT_REVIEWERS || '')
                .split(',')
                .map((item) => item.trim())
                .filter(Boolean);
              const teamsToRequest = (process.env.DEFAULT_REVIEW_TEAMS || '')
                .split(',')
                .map((item) => item.trim())
                .filter(Boolean);

              if (usersToRequest.length || teamsToRequest.length) {
                try {
                  await github.rest.pulls.requestReviewers({
                    owner,
                    repo,
                    pull_number: pr.number,
                    reviewers: usersToRequest,
                    team_reviewers: teamsToRequest
                  });
                } catch (error) {
                  core.warning(`Could not request reviewers: ${error.message}`);
                }
              }
            }

            const checkSummary = checks.length
              ? checks.map((c) => `- ${c.name}: ${c.status}/${c.conclusion}`).join('\n')
              : '- No check runs found yet';

            const requiredChecksSummary = requiredChecks.length
              ? requiredChecks.map((name) => `- ${name}`).join('\n')
              : '- Could not detect required checks (or none configured)';

            const body = [
              marker,
              '### Merge readiness report',
              '',
              `- **Checks**: ${checks.every((c) => c.conclusion === 'success') && checks.length ? 'passed' : 'attention required'}`,
              `- **Review**: ${approvedCount}/${requiredApprovals} approvals`,
              `- **Conversations**: ${unresolvedConversations === 'unknown' ? 'unknown (insufficient permissions)' : `${unresolvedConversations} unresolved`} ${requireConversationResolution ? '(required by branch protection)' : '(not required by branch protection)'}`,
              `- **Branch**: ${isUpToDate ? 'up-to-date' : 'behind base branch'}`,
              `- **Assigned reviewers**: ${requestedReviewers.length ? requestedReviewers.join(', ') : 'none'}`,
              '',
              '**Required checks configured on branch**',
              requiredChecksSummary,
              '',
              '**Latest check runs for this PR**',
              checkSummary,
              '',
              approvedCount < requiredApprovals
                ? '⚠️ Review required: reviewer was requested automatically when configuration is available.'
                : '✅ Required review threshold is satisfied.'
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body
              });
            }
